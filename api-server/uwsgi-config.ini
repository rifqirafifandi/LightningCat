[uwsgi]
module = wsgi:application

master = true
processes = 4
threads = 2

socket = /opt/api-server/api-server.sock
chmod-socket = 664
uid = www-data
gid = www-data
vacuum = true

die-on-term = true
enable-threads = true

# Logging configuration
logto = /opt/api-server/uwsgi.log
log-date = true
logfile-chmod = 644
log-format = [%(addr)] [%(time)] [%(method)] [%(uri)] [%(proto)] [%(status)] [%(msecs)] [%(referer)] [%(uagent)]
log-4xx = true
log-5xx = true

# Optional: Set log level (0-4)
# 0: no logging
# 1: errors only
# 2: warnings
# 3: info
# 4: debug
log-level = 4

# redis sessions
if-env = SESSION_TYPE=redis
enable-threads = true
endif =

# prod
harakiri = 30
max-requests = 5000
